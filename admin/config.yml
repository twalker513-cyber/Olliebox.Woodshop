backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "store"
    label: "Store"
    files:
      - name: "products"
        label: "Products"
        file: "data/products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} - {{fields.price}}"
            fields:
              - { label: "Product Name", name: "name", widget: "string" }
              - { label: "Product ID", name: "id", widget: "string", hint: "Unique ID used for checkout and product URLs. Example: froggy-fresh" }
              - { label: "Category", name: "category", widget: "select", options: [{ label: "Cutting Boards", value: "cutting-boards" }, { label: "Charcuterie Boards", value: "charcuterie-boards" }, { label: "Cigar Ash Trays", value: "cigar-ash-trays" }, { label: "Specialty Boxes", value: "memory-boxes" }, { label: "Rolling Trays", value: "rolling-trays" }, { label: "Bottle Openers", value: "bottle-openers" }] }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Shipping Weight (grams)", name: "weight", widget: "number", value_type: "int", required: false, hint: "Use FINAL packed shipping weight in grams. Example: 8200 = about 18 lb packed." }
              - { label: "Quantity In Stock", name: "stock", widget: "number", value_type: "int", default: 1, required: false, hint: "Set how many of this product are available for purchase." }
              - { label: "Wood", name: "wood", widget: "string", required: false }
              - { label: "Size", name: "size", widget: "string", required: false }
              - { label: "Finish", name: "finish", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Status", name: "status", widget: "select", options: ["available", "sold", "coming-soon"], default: "available" }
              - { label: "Stripe Link", name: "stripeLink", widget: "string", required: false }
              - label: "Product Photos"
                name: "images"
                widget: "list"
                required: false
                summary: "Photo {{fields.image}}"
                hint: "Add product photos here. Put the main product photo first. For the fastest workflow, upload all photos to the Media Library first, then select them here."
                fields:
                  - { label: "Select Photo", name: "image", widget: "image", required: false }